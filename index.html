<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="No idea to what music to listen? No problem!">
    <link rel="stylesheet" href="style.css">
    <title>Random Music</title>
</head>
<body>

    <main>

        <div class="song-displayer">

            <div id="s-container" class="song-container">
                <iframe class="song-frame" data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/3UbEemDEz6b6l5EBiswULJ" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

                <div class="song-data">
                    <p class="title">Burger</p>
                    <p class="singer">BBNO$</p>
                </div>

            </div>

            <button class="reload-btn" id="reloadButton">Other</button>

        </div>

    </main>
    
</body>
</html>
